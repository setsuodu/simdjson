name: Build Native Plugins

# Tag convention (ADR-0003 / OpenUPM monorepo):
#   Unity package tags MUST be: com.setsuodu.simdjson/<semver>
#   e.g. com.setsuodu.simdjson/1.0.0
# Do NOT use bare tags (v1.0.0, 1.0.0) — OpenUPM scans all tags and will mis-ingest them.
# gitTagPrefix belongs only in openupm/openupm data/packages YAML, never in package.json.

on:
  push:
    branches: [main, master]
    paths:
      - 'Packages/com.setsuodu.simdjson/Native/**'
      - '.github/workflows/build-native.yml'
    tags:
      - 'com.setsuodu.simdjson/*'
  pull_request:
    paths:
      - 'Packages/com.setsuodu.simdjson/Native/**'
      - '.github/workflows/build-native.yml'
  workflow_dispatch:
    inputs:
      commit_plugins:
        description: 'Commit built plugins back to repo (main only)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

env:
  NATIVE_DIR: Packages/com.setsuodu.simdjson/Native
  PLUGINS_DIR: Packages/com.setsuodu.simdjson/Runtime/Plugins
  PACKAGE_NAME: com.setsuodu.simdjson
  ANDROID_API: android-24
  NDK_VERSION: r27c

jobs:
  # ── Windows (Editor / Standalone Win64) ───────────────────────────────────
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Configure & Build
        shell: bash
        working-directory: ${{ env.NATIVE_DIR }}
        run: |
          set -euo pipefail
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release --parallel
          find . -type f \( -name '*.dll' -o -name '*.so' -o -name '*.dylib' \) -ls || true

      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          OUT=artifact/windows/x86_64
          mkdir -p "$OUT"
          LIB=$(find "${{ env.NATIVE_DIR }}/build" -type f -name 'simdjson_unity.dll' | head -n1)
          test -n "$LIB"
          cp "$LIB" "$OUT/simdjson_unity.dll"
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-x86_64
          path: artifact/windows/x86_64/
          if-no-files-found: error
          retention-days: 30

  # ── Android (NDK, multiple ABIs) ──────────────────────────────────────────
  android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          # - x86_64   # emulator only — uncomment when needed
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Configure & Build
        shell: bash
        working-directory: ${{ env.NATIVE_DIR }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          mkdir -p "build-android-${{ matrix.abi }}"
          cd "build-android-${{ matrix.abi }}"

          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=${{ env.ANDROID_API }} \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build . --config Release --parallel

          find . -type f -name '*.so' -ls || true

      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifact/android/${{ matrix.abi }}"
          mkdir -p "$OUT"
          LIB=$(find "${{ env.NATIVE_DIR }}/build-android-${{ matrix.abi }}" \
            -type f -name 'libsimdjson_unity.so' | head -n1)
          test -n "$LIB"
          cp "$LIB" "$OUT/libsimdjson_unity.so"
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: native-android-${{ matrix.abi }}
          path: artifact/android/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 30

  # ── Optional desktop (disabled by default — re-enable when needed) ───────
  # linux:
  #   name: Linux x86_64
  #   runs-on: ubuntu-latest
  #   ...
  #
  # macos:
  #   name: macOS arm64
  #   runs-on: macos-latest
  #   ...
  # Avoid macos-13 (Intel) — runner pool is tiny and queues for hours.

  # ── Package into Unity Plugins layout ─────────────────────────────────────
  package:
    name: Package plugins
    needs: [windows, android]
    runs-on: ubuntu-latest
    if: always() && needs.windows.result == 'success' && needs.android.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloaded
          pattern: native-*
          merge-multiple: false

      - name: Layout into Runtime/Plugins
        shell: bash
        run: |
          set -euo pipefail
          PLUGINS="${{ env.PLUGINS_DIR }}"
          mkdir -p "$PLUGINS"

          layout() {
            local src="$1" dest="$2" name="$3"
            mkdir -p "$dest"
            if [ -f "$src/$name" ]; then
              cp -v "$src/$name" "$dest/$name"
            else
              echo "WARN: missing $src/$name"
              exit 1
            fi
          }

          # Windows Editor / Standalone
          layout downloaded/native-windows-x86_64 "$PLUGINS/x86_64" "simdjson_unity.dll"

          # Android (Unity expects ABI folder names under Android/)
          layout downloaded/native-android-arm64-v8a  "$PLUGINS/Android/libs/arm64-v8a"  "libsimdjson_unity.so"
          layout downloaded/native-android-armeabi-v7a "$PLUGINS/Android/libs/armeabi-v7a" "libsimdjson_unity.so"

          echo "=== Final Plugins tree ==="
          find "$PLUGINS" -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: unity-plugins-all
          path: ${{ env.PLUGINS_DIR }}/
          retention-days: 30

      - name: Commit plugins back to repo
        if: >
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.commit_plugins == 'true' &&
          github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.PLUGINS_DIR }}"
          if git diff --staged --quiet; then
            echo "No plugin changes to commit."
            exit 0
          fi
          git commit -m "chore: update native plugins from CI (${{ github.sha }})"
          git push

      - name: Create GitHub Release (package tag only)
        if: startsWith(github.ref, format('refs/tags/{0}/', env.PACKAGE_NAME))
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ env.PLUGINS_DIR }}/x86_64/*
            ${{ env.PLUGINS_DIR }}/Android/libs/arm64-v8a/*
            ${{ env.PLUGINS_DIR }}/Android/libs/armeabi-v7a/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
